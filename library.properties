sentence=Engine for RP2040 escape room puzzles: FSM, multi-puzzle, RS485, audio.
paragraph=Hardware-abstracted engine for building escape room puzzles on the Adafruit PropMaker Feather RP2040: a synchronous puzzle state machine, multi-puzzle orchestration with game levels, MP3 playback over I2S with the Helix decoder, PCF8574/PCF8575 I/O expanders via IoAbstraction, MCP23017, HT16K33 14-segment display, NeoPixel strips with per-puzzle ranges, servo, LIS3DH accelerometer, ADS1115 ADC, PCA9685 PWM, PN532 NFC, phone rotary dial, native rotary encoder, PGA2310 volume control and an RS485 bus for inter-puzzle communication on portable escape rooms and boxes.
category=Device Control
